    {

      "notes": "私の話はここまで。あなたの「でも」に戻ります。飲み込んだあと、このままじゃいけないと思って、自分を変えようとしましたよね。本、読みましたよね。YouTube、見ましたよね。講座も出た。診断も占いも受けた。ノートにも書いた。……で、しばらくすると、また同じ毎日に戻りましたよね。自分のことは後回しの、あの毎日に。それは、あなたのせいじゃありません。むしろ、あなたが「ちゃんとできる人」だから、解決しなかったんです。ちゃんとしようとする、その中に、自分でも気づいていないルールが隠れているから。方法が悪いんじゃありません。どれも役に立ちます。問題は方法ではありません。真面目な人ほど、それさえも「自分だけで解決するための課題」にしてしまうことです。できないと、方法ではなく自分を責める。だから知識が増えても、日常では同じ場所へ戻ります。"

    {

    {
      "sceneId": "s06",

    {
      "sceneId": "s07",
      "notes": "私は、人が本来持っている良さが出た瞬間を見るのが大好きです。高校で数学を約20年教えました。授業や教育相談で、生徒やクライアントさんと向き合ってきた時間は、合わせておよそ1万時間。その間ずっと、考えてきたことがあります。どうしたら人は成長できるのか。そして、人はなぜ、頭では分かっていても動けないのか。大学院では、世界の教育、不登校の要因、認知心理学を学びました。その問いを、学問として掘ってきました。\nそして数学とは、論理と証明。ルールを見抜く学問です。悩みも、実は数学の問題と同じだと気づきました。心のモヤモヤの中にも、必ずルールがあります。その後コーチとして5年、今度は大人が自分の人生を選び直す時間に寄り添ってきました。"

    {

    {

    {

    },
    {
      "sceneId": "s13b",
      "notes": "（3秒、黙る）"
    },
    {
      "sceneId": "s14",

    {

    },
    {

    {
      "sceneId": "s16",

    },
    {
      "sceneId": "s18",

    {

    {
      "sceneId": "s21",

    {
      "sceneId": "s24",
      "notes": "三つ目は、親友の声を選ぶこと。自分の味方として、選ぶ、ということです。心の中に住んでいるのは、監視役だけではありません。もう一人、何があっても自分の味方をしてくれる親友を、住まわせます。「そう思うよね。でも今回は、私はこっちを選んでみたい」——これが、その親友の声です。本音が聞こえても、選ばなければ監視役の勝ちです。小さく選んだ経験が「やってもいいんだ」を育て、味方の声が強くなっていきます。監視役が黙るまで待ちません。「そう思うよね。でも今回は、私はこっちを選んでみたい」と、自分にも味方します。毎回でなくていい。三回に一回、小さく違う選択を試します。（W8 row11 D）"

      "sceneId": "s25",

    {
      "sceneId": "s26",

    },

      "sceneId": "s26c",

      "sceneId": "s26d",

      "sceneId": "s27",
      "notes": "今日の話は三つです。方法を増やしても、自分だけで解決しようとする限り、戻る。真の原因は、監視役のルールを正解だと思って守っていること。本当の解決策は、ほどく、聴く、選ぶ。ここだけ持ち帰ってください。"

      "sceneId": "s28",
      "notes": "私は今も、間違えるのが極端に怖いです。監視役は、まだ私の中にいます。でも、間違えないために努力してきた力で、ここまで来たのも本当です。だから、追い出さない。向きを変えるだけ。私は、今も「おりこうさん代表」です。私自身も「脱おりこうさん」を完成した人ではなく、毎日の心の自由さへ向かう途中にいる。だからこそ、上から正解を教えるのではなく、同じように迷いながら生きる一人として、一緒に見つけていきたい。一人で頑張らせません。動き出すまで、最後まで隣で伴走します。（初美さん 9/25／W11 row3 J・row12 J）"

      "sceneId": "s29",
      "notes": "今日の話に一つでも心当たりがあった方へ。私と一緒に、あなたを縛っているルールを一つ見つける90分の初回セッションをご案内します。ここまで聞いてくださった方は、もう入口に立っています。「でも」の正体も、監視役のことも、もう知っている。だから初回の90分は、いつもより深いところから始められます。その分を、価格でお返しします。ここまで聞いてくださった方だけ、今日だけ。通常15,000円のところ、税込9,800円です。「ほんとはこうしたい。でも」の奥を一緒に見つけ、ほどく・聴く・選ぶの最初の一歩をつくる時間です。詳しい申込方法は、このあとの案内をご覧ください。\n今日お話ししたとおり、「ちゃんと終わってから」の\"終わり\"は、一生来ません。だからこの案内も、今日だけにします。\n今日の話に心当たりがあって、本気で変わりたいと思った方は、今日、申し込んでください。"

<script>
  (function(){
    var TITLES = ["表紙", "名乗り", "フック", "今日の3つ", "現状", "一般的な解決策", "常識の否定", "理想", "信念", "プロフィール", "1度目の挫折", "共感", "2度目の挫折", "開発秘話", "真の原因", "間（3秒黙る）", "監視役はどう育った", "図解A 監視役がしていること", "痛み", "ポイント1", "ポイント2", "ポイント3", "席をつくる", "3ステップ", "30秒ワーク", "STEP1", "STEP2", "STEP3", "図解B 新しいルート", "成果の声", "ビフォー／アフター", "なぜ自分では見つけられない", "なぜ私は見つけられる", "今日の3つ", "私も途中", "申し込み案内"];
    var isAudience = new URLSearchParams(location.search).get("mode") === "audience";
    if (isAudience) document.body.classList.add("is-audience");
    var slider = document.getElementById("slider");
    var num = document.getElementById("bar-num");
    var title = document.getElementById("bar-title");
    var ticks = document.getElementById("ticks");
    var total = TITLES.length;
    for (var t = 0; t < total; t++) {
      var sp = document.createElement("span");
      sp.style.left = (t / (total - 1) * 100) + "%";
      ticks.appendChild(sp);
    }
    var current = 0;
    function paint(i){
      current = i;
      slider.value = String(i);
      slider.style.setProperty("--pct", (i / (total - 1) * 100) + "%");
      num.textContent = (i + 1) + " / " + total;
      title.textContent = TITLES[i];
    }
    function go(i){
      if (i === current) { paint(i); return; }
      window.postMessage({ type: "goto", slideIndex: i }, "*");
      paint(i);
      var ss = document.querySelector("hyperframes-slideshow");
      if (ss && ss.focus) ss.focus();
    }
    slider.addEventListener("input", function(){ go(Number(slider.value)); });
    window.addEventListener("keydown", function(e){
      if (e.key === "ArrowRight" || e.key === " ") paint(Math.min(current + 1, total - 1));
      if (e.key === "ArrowLeft" || e.key === "Backspace") paint(Math.max(current - 1, 0));
    });
    paint(0);
    var ss = document.querySelector("hyperframes-slideshow");
    if (ss && ss.focus) ss.focus();
  })();
</script>
</body>
</html>
